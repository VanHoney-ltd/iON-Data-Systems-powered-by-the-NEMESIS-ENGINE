[package]
name = "ion"
version = "2.1.0"
edition = "2021"
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "minios"
path = "src/main.rs"

[[bin]]
name = "ion"
path = "src/bin/ion.rs"

[[bin]]
name = "minios-export"
path = "src/ui_export.rs"

[features]
default = []
afcclient = []

[dependencies]
aes = "0.8"
aes-kw = { version = "0.2", features = ["std"] }
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1.4"
csv = "1.3"
crossterm = "0.27"
dirs = "5.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
exif = { package = "kamadak-exif", version = "0.6" }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
html-escape = "0.2"
log = "0.4"
pbkdf2 = "0.12"
plist = "1.6"
rand = "0.8"
rpassword = "7.3"
regex = "1.11"
rusqlite = { version = "0.29", features = ["backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
strsim = "0.11"
tokio = { version = "1.37", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
walkdir = "2.3"
tempfile = "3.10"
url = "2.5"
zeroize = "1.8"
aes-gcm = "0.10"
rayon = "1.8"
reqwest = { version = "0.11", features = ["blocking", "json"] }
mime_guess = "2.0"
filetime = "0.2"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
toml = "0.8"
tar = "0.4"
age = { version = "0.10", features = ["armor"] }

[build-dependencies]
cc = "1.0"
